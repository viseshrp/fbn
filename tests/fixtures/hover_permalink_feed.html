<!doctype html>
<html lang="en">
  <body>
    <main role="main">
      <div role="feed">
        <div aria-posinset="1">
          <div data-ad-rendering-role="profile_name">
            <a href="https://www.facebook.com/groups/test-group/user/111/">Primary Example</a>
          </div>
          <a id="timestamp" href="https://www.facebook.com/groups/test-group/?__tn__=%2CO"
             onmouseover="this.href='https://www.facebook.com/groups/test-group/posts/502/'; this.dataset.hovered='yes'">
            <span>2h</span><span style="display: none">Hidden timestamp decoy</span>
          </a>
          <div data-ad-rendering-role="story_message">Primary story with photos</div>
          <a href="https://www.facebook.com/photo/?fbid=601&amp;set=pcb.502">Photo</a>
          <button>Like</button>
          <div role="article" aria-label="Comment by Comment Example">
            <a id="comment-timestamp" href="https://www.facebook.com/groups/test-group/?__tn__=%2CO"
               onmouseover="this.href='https://www.facebook.com/groups/test-group/posts/999/?comment_id=42'; this.dataset.hovered='yes'">1h</a>
            <div data-ad-rendering-role="story_message">Comment text</div>
          </div>
          <div role="article" aria-label="Shared post">
            <a id="quoted-timestamp" href="https://www.facebook.com/groups/test-group/?__tn__=%2CO"
               onmouseover="this.href='https://www.facebook.com/groups/test-group/posts/998/'; this.dataset.hovered='yes'">3h</a>
            <div data-ad-rendering-role="story_message">Quoted text</div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
