name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: make install-dev

      - name: Check installed dependency consistency
        run: make check-deps

      - name: Run unit tests
        run: make test-unit

  quality:
    name: Lint, format, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and build dependencies
        run: make install-dev

      - name: Run Ruff
        run: make lint

      - name: Build and validate distributions
        run: |
          make build
          make check-dist

      - name: Smoke test the built wheel
        run: make smoke-wheel

  browser-integration:
    name: Sanitized local browser integration
    runs-on: ubuntu-latest
    # A cold Chromium/dependency install plus the full suite can exceed 30m.
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: make install-dev

      - name: Install Playwright Chromium and Linux dependencies
        run: make install-browser

      - name: Run local-page browser integration test
        run: make test-browser

  docker:
    name: Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Validate Compose configuration
        run: make docker-config

      - name: Build the native-architecture image
        env:
          DOCKER_IMAGE: fbn:ci
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: make docker-build

      - name: Run container smoke and persistence checks
        env:
          DOCKER_IMAGE: fbn:ci
        run: make docker-smoke
