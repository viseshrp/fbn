[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fbn"
dynamic = ["version"]
description = "Unreleased local academic Facebook group monitor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Visesh Prasad", email = "visesh@live.com" },
]
maintainers = [
  { name = "Visesh Prasad", email = "visesh@live.com" },
]
keywords = ["facebook", "group", "monitor", "notification", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
]
dependencies = [
  "apprise>=1.9,<2",
  "click>=8.1,<9",
  "filelock>=3.16,<4",
  "platformdirs>=4.3,<5",
  "playwright>=1.61,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=6,<7",
]

[project.scripts]
fbn = "fbn.cli:main"

[project.urls]
Documentation = "https://github.com/viseshrp/fbn"
Changelog = "https://github.com/viseshrp/fbn/blob/main/CHANGELOG.md"
Issues = "https://github.com/viseshrp/fbn/issues"
Source = "https://github.com/viseshrp/fbn"

[tool.setuptools]
packages = ["fbn"]

[tool.setuptools.dynamic]
version = { attr = "fbn.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fbn"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
