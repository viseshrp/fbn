x-fbn-build: &fbn-build
  context: .
  args:
    FBN_GID: "${FBN_GID:-1000}"
    FBN_UID: "${FBN_UID:-1000}"
    PLAYWRIGHT_VERSION: "1.61.0"

services:
  fbn:
    image: fbn:local
    build: *fbn-build
    init: true
    restart: "no"
    stop_grace_period: 2m
    shm_size: "1gb"
    environment:
      FBN_APPRISE_URL: "${FBN_APPRISE_URL:?Set FBN_APPRISE_URL to an Apprise URL}"
      FBN_PROFILE_DIR: /home/fbn/.local/share/fbn/profile
      FBN_STATE_FILE: /home/fbn/.local/share/fbn/state.sqlite3
      FBN_TIMEZONE: "${FBN_TIMEZONE:-UTC}"
    volumes:
      - fbn-data:/home/fbn/.local/share/fbn
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command:
      - monitor
      - --id
      - "${FBN_GROUP:?Set FBN_GROUP to a group ID, slug, or canonical URL}"
      - --browser
      - chromium
      - --headless
      - --verbose
      - --every
      - "${FBN_EVERY:-50m}"
      - --to
      - "${FBN_TO:-50m}"

  bootstrap:
    image: fbn:local
    build: *fbn-build
    init: true
    restart: "no"
    stop_grace_period: 2m
    shm_size: "1gb"
    environment:
      FBN_PROFILE_DIR: /home/fbn/.local/share/fbn/profile
    volumes:
      - fbn-data:/home/fbn/.local/share/fbn
    secrets:
      - source: facebook_auth
        target: facebook_auth
    command:
      - bootstrap
      - --auth-file
      - /run/secrets/facebook_auth
      - -i
      - "${FBN_GROUP:?Set FBN_GROUP to a group ID, slug, or canonical URL}"
      - --browser
      - chromium

secrets:
  facebook_auth:
    file: "${FBN_AUTH_FILE:?Set FBN_AUTH_FILE to a private authentication export}"

volumes:
  fbn-data:
    external: true
    name: "${FBN_DATA_VOLUME:-fbn-monitor-data}"
